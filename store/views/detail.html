<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Buku - Rak Buku Cera Store</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital@0;1&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .blog-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .blog-title {
            font-size: 3rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .blog-meta {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .blog-content {
            max-width: 800px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 768px) {
            .blog-content {
                padding: 30px 20px;
            }

            .blog-title {
                font-size: 2.2rem;
            }
        }

        .btn-cart {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 30px;
            background: var(--text-primary);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-cart:hover {
            background: #333;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <!-- Parallax Blobs Context -->
    <div class="blob-wrapper" id="blobWrapper">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="glass-nav sticky-nav">
        <div class="nav-content">
            <a href="/" class="logo"
                style="text-decoration:none; font-family:'Playfair Display'; font-weight:bold; font-size:1.5rem; color:#111;">
                Rak Buku Cera Store
            </a>
            
            <div class="nav-actions">
                <button class="mobile-menu-btn" aria-label="Toggle Menu">
                    <i data-feather="menu"></i>
                </button>
            </div>

            <ul class="nav-links">
                <li><a href="/">Katalog</a></li>
                <li><a href="/cart"></i> Keranjang <span id="cart-count"></span></a></li>
            </ul>
        </div>
    </nav>

    <main style="padding-top: 150px;">
        <section class="section" id="detail-container">
            <p style="text-align: center; width: 100%;">Memuat data dari database...</p>
        </section>
        <footer class="glass-footer" style="margin-top: 60px;">
            <p>&copy; 2026 Rak Buku Cera | Dwi Margi Astuti x Rohman Firmandika</p>
        </footer>
    </main>

    <script src="/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get('id');
            if (bookId) {
                fetchBookDetail(bookId);
            } else {
                document.getElementById('detail-container').innerHTML = '<p style="text-align: center; width: 100%;">Buku tidak ditemukan.</p>';
            }
        });
    </script>
</body>

</html>
